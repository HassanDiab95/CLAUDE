<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Smart Emoji Plant: wiring diagram (ESP32)</title>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2b22">Smart Emoji Plant: Wiring Diagram (ESP32 DevKit V1)</text>
  <text x="700" y="52" text-anchor="middle" fill="#5f6f64">Red = 5 V · Orange = 3.3 V · Black = GND · Coloured = signals · Dashed = voltage measurement taps</text>

  <!-- ===================== POWER CHAIN ===================== -->
  <rect x="30" y="85" width="160" height="85" rx="8" fill="#e8f1fb" stroke="#2a7ab8" stroke-width="2"/>
  <text x="110" y="112" text-anchor="middle" font-weight="bold">Solar panel</text>
  <text x="110" y="132" text-anchor="middle">6 V · 5–6 W</text>
  <text x="182" y="114" text-anchor="end" font-size="12">+</text>
  <text x="182" y="154" text-anchor="end" font-size="12">−</text>

  <rect x="215" y="98" width="90" height="34" rx="6" fill="#f6f6f6" stroke="#444"/>
  <text x="260" y="113" text-anchor="middle" font-size="12" font-weight="bold">1N5819</text>
  <text x="260" y="127" text-anchor="middle" font-size="10">diode ▶</text>

  <rect x="330" y="80" width="200" height="125" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
  <text x="430" y="102" text-anchor="middle" font-weight="bold">TP4056 charger</text>
  <text x="430" y="118" text-anchor="middle" font-size="11">USB-C, with protection</text>
  <text x="338" y="119" font-size="11">IN+</text>
  <text x="338" y="154" font-size="11">IN−</text>
  <text x="522" y="134" text-anchor="end" font-size="11">OUT+</text>
  <text x="522" y="179" text-anchor="end" font-size="11">OUT−</text>
  <text x="383" y="198" font-size="11">B+</text>
  <text x="463" y="198" font-size="11">B−</text>

  <rect x="575" y="112" width="80" height="34" rx="6" fill="#f6f6f6" stroke="#444"/>
  <text x="615" y="134" text-anchor="middle" font-size="12" font-weight="bold">ON / OFF</text>

  <rect x="690" y="80" width="200" height="105" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="103" text-anchor="middle" font-weight="bold">MT3608 boost</text>
  <text x="790" y="121" text-anchor="middle" font-size="11">VIN 3.7 V → VOUT 5.0 V</text>
  <text x="790" y="139" text-anchor="middle" font-size="11" fill="#c0392b">Set 5.0 V with the screw</text>
  <text x="790" y="154" text-anchor="middle" font-size="11" fill="#c0392b">BEFORE connecting the ESP32</text>
  <text x="698" y="134" font-size="11">VIN+</text>
  <text x="698" y="172" font-size="11">VIN−</text>
  <text x="882" y="172" text-anchor="end" font-size="11">VOUT− / VOUT+</text>

  <rect x="330" y="245" width="200" height="60" rx="8" fill="#eef7ee" stroke="#2f7d4f" stroke-width="2"/>
  <text x="430" y="270" text-anchor="middle" font-weight="bold">2 × 18650 Li-ion</text>
  <text x="430" y="288" text-anchor="middle" font-size="11">in PARALLEL · 3.7 V · ~6000 mAh</text>

  <!-- power wires -->
  <g fill="none" stroke-width="3">
    <polyline points="190,113 215,113" stroke="#d62828"/>
    <polyline points="305,113 330,113" stroke="#d62828"/>
    <polyline points="190,150 330,150" stroke="#000"/>
    <polyline points="390,205 390,245" stroke="#d62828"/>
    <polyline points="470,205 470,245" stroke="#000"/>
    <polyline points="530,130 575,130" stroke="#d62828"/>
    <polyline points="655,130 690,130" stroke="#d62828"/>
    <polyline points="530,175 690,168" stroke="#000"/>
    <!-- MT3608 outputs to rails -->
    <polyline points="860,185 860,235" stroke="#d62828"/>
    <polyline points="800,185 800,265" stroke="#000"/>
  </g>

  <!-- Rails -->
  <line x1="560" y1="235" x2="1370" y2="235" stroke="#d62828" stroke-width="4"/>
  <text x="900" y="228" font-weight="bold" fill="#d62828">5 V rail (from MT3608 VOUT+)</text>
  <line x1="560" y1="265" x2="1370" y2="265" stroke="#000" stroke-width="4"/>
  <text x="900" y="283" font-weight="bold">GND rail → GND of EVERY module</text>
  <line x1="270" y1="325" x2="1370" y2="325" stroke="#f39c12" stroke-width="4"/>
  <text x="760" y="318" font-weight="bold" fill="#f39c12">3.3 V rail (ESP32 3V3) → VCC of soil sensor, DHT22, OLED, BH1750</text>
  <circle cx="860" cy="235" r="5" fill="#d62828"/>
  <circle cx="800" cy="265" r="5" fill="#000"/>

  <!-- ===================== ESP32 ===================== -->
  <rect x="520" y="370" width="300" height="420" rx="12" fill="#22313f" stroke="#111" stroke-width="2"/>
  <text x="670" y="400" text-anchor="middle" fill="#fff" font-weight="bold" font-size="17">ESP32 DevKit V1</text>
  <rect x="625" y="520" width="90" height="75" rx="4" fill="#9aa5b1"/>
  <text x="670" y="562" text-anchor="middle" font-size="11">ESP-WROOM-32</text>
  <!-- top power pins -->
  <g fill="#f1c40f"><circle cx="600" cy="370" r="5"/><circle cx="670" cy="370" r="5"/><circle cx="740" cy="370" r="5"/></g>
  <g fill="#fff" font-size="12" text-anchor="middle">
    <text x="600" y="420">VIN</text><text x="670" y="420">GND</text><text x="740" y="420">3V3</text>
  </g>
  <g fill="none" stroke-width="3">
    <polyline points="600,370 600,235" stroke="#d62828"/>
    <polyline points="670,370 670,265" stroke="#000"/>
    <polyline points="740,370 740,325" stroke="#f39c12"/>
  </g>
  <circle cx="600" cy="235" r="5" fill="#d62828"/><circle cx="670" cy="265" r="5" fill="#000"/><circle cx="740" cy="325" r="5" fill="#f39c12"/>
  <!-- left pins -->
  <g fill="#fff" font-size="12">
    <text x="532" y="469">GPIO39 / VN</text>
    <text x="532" y="539">GPIO35</text>
    <text x="532" y="609">GPIO34</text>
    <text x="532" y="679">GPIO4</text>
    <text x="532" y="749">GPIO13</text>
  </g>
  <g fill="#f1c40f">
    <circle cx="520" cy="465" r="5"/><circle cx="520" cy="535" r="5"/><circle cx="520" cy="605" r="5"/>
    <circle cx="520" cy="675" r="5"/><circle cx="520" cy="745" r="5"/>
  </g>
  <!-- right pins -->
  <g fill="#fff" font-size="12" text-anchor="end">
    <text x="808" y="459">GPIO21 (SDA)</text>
    <text x="808" y="489">GPIO22 (SCL)</text>
    <text x="808" y="649">GPIO17 (TX2)</text>
    <text x="808" y="689">GPIO16 (RX2)</text>
    <text x="808" y="759">GPIO2 = on-board LED</text>
  </g>
  <g fill="#f1c40f">
    <circle cx="820" cy="455" r="5"/><circle cx="820" cy="485" r="5"/>
    <circle cx="820" cy="645" r="5"/><circle cx="820" cy="685" r="5"/>
  </g>

  <!-- ===================== LEFT MODULES ===================== -->
  <rect x="30" y="430" width="220" height="70" rx="8" fill="#e8f1fb" stroke="#2a7ab8" stroke-width="2"/>
  <text x="140" y="452" text-anchor="middle" font-weight="bold">Solar voltage divider</text>
  <text x="140" y="470" text-anchor="middle" font-size="11">panel+ → 100k → node → 47k → GND</text>
  <text x="140" y="487" text-anchor="middle" font-size="11">node → GPIO39</text>
  <polyline points="110,170 110,430" fill="none" stroke="#2a7ab8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="118" y="300" font-size="11" fill="#2a7ab8">from panel +</text>
  <polyline points="250,465 520,465" fill="none" stroke="#2a7ab8" stroke-width="3"/>

  <rect x="30" y="510" width="220" height="70" rx="8" fill="#eef7ee" stroke="#2f7d4f" stroke-width="2"/>
  <text x="140" y="532" text-anchor="middle" font-weight="bold">Battery voltage divider</text>
  <text x="140" y="550" text-anchor="middle" font-size="11">B+ → 100k → node → 100k → GND</text>
  <text x="140" y="567" text-anchor="middle" font-size="11">node → GPIO35 (+100 nF to GND)</text>
  <polyline points="330,295 290,295 290,520 250,520" fill="none" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="296" y="410" font-size="11" fill="#2f7d4f">from B+</text>
  <polyline points="250,535 520,535" fill="none" stroke="#2f7d4f" stroke-width="3"/>

  <rect x="30" y="590" width="220" height="60" rx="8" fill="#f3e9dc" stroke="#8a5a2b" stroke-width="2"/>
  <text x="140" y="613" text-anchor="middle" font-weight="bold">Capacitive soil sensor v1.2</text>
  <text x="140" y="633" text-anchor="middle" font-size="11">VCC → 3.3 V · GND · AOUT → GPIO34</text>
  <polyline points="250,605 520,605" fill="none" stroke="#8a5a2b" stroke-width="3"/>

  <rect x="30" y="660" width="220" height="60" rx="8" fill="#f7f0ff" stroke="#7d3cbf" stroke-width="2"/>
  <text x="140" y="683" text-anchor="middle" font-weight="bold">DHT22 temp + humidity</text>
  <text x="140" y="703" text-anchor="middle" font-size="11">+ → 3.3 V · − → GND · OUT → GPIO4</text>
  <polyline points="250,675 520,675" fill="none" stroke="#7d3cbf" stroke-width="3"/>

  <rect x="30" y="730" width="220" height="50" rx="8" fill="#f6f6f6" stroke="#444" stroke-width="2"/>
  <text x="140" y="752" text-anchor="middle" font-weight="bold">Push button</text>
  <text x="140" y="770" text-anchor="middle" font-size="11">leg 1 → GPIO13 · leg 2 → GND</text>
  <polyline points="250,745 520,745" fill="none" stroke="#444" stroke-width="3"/>

  <!-- ===================== RIGHT MODULES ===================== -->
  <rect x="1010" y="400" width="230" height="75" rx="8" fill="#e9eef5" stroke="#22313f" stroke-width="2"/>
  <rect x="1022" y="412" width="58" height="34" fill="#0b1a2a"/>
  <text x="1051" y="436" text-anchor="middle" font-size="18">😊</text>
  <text x="1160" y="423" text-anchor="middle" font-weight="bold">OLED 0.96" SSD1306</text>
  <text x="1160" y="441" text-anchor="middle" font-size="11">I2C address 0x3C</text>
  <text x="1125" y="465" text-anchor="middle" font-size="11">VCC → 3.3 V · GND · SDA · SCL</text>

  <rect x="1010" y="495" width="230" height="65" rx="8" fill="#fffbe0" stroke="#b59a00" stroke-width="2"/>
  <text x="1125" y="518" text-anchor="middle" font-weight="bold">BH1750 light sensor</text>
  <text x="1125" y="536" text-anchor="middle" font-size="11">I2C 0x23 (ADDR → GND)</text>
  <text x="1125" y="552" text-anchor="middle" font-size="11">VCC → 3.3 V · GND · SDA · SCL</text>

  <!-- I2C bus -->
  <g fill="none" stroke-width="3">
    <polyline points="820,455 1010,455" stroke="#2f7d4f"/>
    <polyline points="930,455 930,530 1010,530" stroke="#2f7d4f"/>
    <polyline points="820,485 960,485 960,470 1010,470" stroke="#8e44ad"/>
    <polyline points="960,485 960,545 1010,545" stroke="#8e44ad"/>
  </g>
  <circle cx="930" cy="455" r="4" fill="#2f7d4f"/><circle cx="960" cy="485" r="4" fill="#8e44ad"/>
  <text x="850" y="447" font-size="11" fill="#2f7d4f">SDA</text>
  <text x="850" y="500" font-size="11" fill="#8e44ad">SCL</text>

  <!-- DFPlayer -->
  <rect x="1010" y="610" width="230" height="110" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="1125" y="633" text-anchor="middle" font-weight="bold">DFPlayer Mini (MP3)</text>
  <text x="1125" y="651" text-anchor="middle" font-size="11">micro-SD: /mp3/0001.mp3 …</text>
  <text x="1020" y="649" font-size="11">RX</text>
  <text x="1020" y="689" font-size="11">TX</text>
  <text x="1232" y="636" text-anchor="end" font-size="11">VCC</text>
  <text x="1232" y="666" text-anchor="end" font-size="11">GND</text>
  <text x="1125" y="712" text-anchor="middle" font-size="11">SPK_1 · SPK_2</text>
  <g fill="none" stroke-width="3">
    <polyline points="820,645 900,645" stroke="#2a7ab8"/>
    <polyline points="950,645 1010,645" stroke="#2a7ab8"/>
    <polyline points="1010,685 820,685" stroke="#16a085"/>
    <polyline points="1240,632 1300,632 1300,235" stroke="#d62828"/>
    <polyline points="1240,662 1330,662 1330,265" stroke="#000"/>
  </g>
  <circle cx="1300" cy="235" r="5" fill="#d62828"/><circle cx="1330" cy="265" r="5" fill="#000"/>
  <rect x="900" y="636" width="50" height="18" fill="#fff" stroke="#2a7ab8" stroke-width="2"/>
  <text x="925" y="649" text-anchor="middle" font-size="11">1 kΩ</text>
  <text x="840" y="637" font-size="11" fill="#2a7ab8">TX2 → RX</text>
  <text x="840" y="700" font-size="11" fill="#16a085">RX2 ← TX</text>

  <!-- Speaker -->
  <rect x="1060" y="770" width="130" height="60" rx="30" fill="#f6f6f6" stroke="#444" stroke-width="2"/>
  <text x="1125" y="796" text-anchor="middle" font-weight="bold">Speaker</text>
  <text x="1125" y="814" text-anchor="middle" font-size="11">3 W · 4–8 Ω</text>
  <g fill="none" stroke="#444" stroke-width="2">
    <polyline points="1105,720 1105,770"/>
    <polyline points="1145,720 1145,770"/>
  </g>

  <text x="30" y="860" font-size="12" fill="#5f6f64">Note: while the ESP32 is connected to a PC by USB for programming, turn the ON/OFF switch OFF so the boost converter and USB do not both feed the 5 V pin.</text>
  <text x="30" y="880" font-size="12" fill="#5f6f64">Use only ADC1 pins (GPIO32–39) for analog sensors: ADC2 pins do not work while Wi-Fi is on.</text>
</svg>
