# More memory for Gradle: Kotlin is compiled inside the Gradle process (see below)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Longer timeouts so the Gradle download does not time out on slow connections
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
# Allows building even if the project folder path contains Arabic (non-ASCII) letters.
# Best practice is still to keep the project in a path with English letters only, e.g. E:\Rayy-Project
android.overridePathCheck=true

# Compile Kotlin inside the Gradle process instead of a separate "Kotlin compile daemon".
# Fixes: "Daemon compilation failed: Could not connect to Kotlin compile daemon"
# (happens with some JDKs, antivirus programs, little memory or unusual folder paths).
kotlin.compiler.execution.strategy=in-process
